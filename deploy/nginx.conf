# Nginx site config for primeyatra.co.in
# Copy to /etc/nginx/sites-available/primeyatra, then:
#   ln -s /etc/nginx/sites-available/primeyatra /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Run certbot afterwards; it adds the HTTPS (443) block and the HTTP -> HTTPS redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name primeyatra.co.in www.primeyatra.co.in;

    root /var/www/primeyatra/dist;
    index index.html;

    # Pages: /about-us/ is served from about-us/index.html
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Hashed CSS/JS and images can be cached for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
}
